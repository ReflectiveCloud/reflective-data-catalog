metadata:
  version: 2
  description: "Climate Model Experiments - Solar Geoengineering (SAI) Simulations"
  documentation: "https://reflectivecloud.github.io/Book/"
  # Schema v2 (2026-08): entries renamed to the documented public source
  # names, canonical parameter vocabulary (ensemble/table/variable plus
  # per-entry extras), custom fields live under entry metadata. See
  # migration_matrix.yaml (shipped alongside) for old->new dispositions.
  
sources:
  # ============================================================================
  # G6-1.5K-HiLLA Experiments
  # High-latitude injection (60°N/S at 15km) targeting 1.5K warming
  # ============================================================================
  
  ukesm1_g6_1p5k_hilla:
    driver: zarr
    description: "UKESM1.1 G6-1.5K-HiLLA (Zarr): SAI with 60°N/S injection at 15km to hold global mean temperature to 1.5K"
    args:
      urlpath: "s3://reflective-persistent-prod-large/UKESM1-1/G6-1.5K-HiLLA/{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier"
        type: str
        default: "r1i1p1f2"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "Aday"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "UKESM1.1"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5 in UKESM1.1 (on cloud hub not the CMIP6 version)"
      temperature_target: "1.5K"
      variables_list: "https://docs.google.com/spreadsheets/d/1GfkOx6W6U5lxMb1f-xBPEtvKZZ0IDu2xtyVH7ppAQ6M/edit?usp=sharing"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "high-latitude", "UKESM1.1", "G6-1.5K-HiLLA", "feedback-control"]
  
  cesm2_waccm_g6_1p5k_hilla:
    driver: zarr
    description: "CESM2-WACCM G6-1.5K-HiLLA (Zarr): SAI with 60°N/S injection at 15km to hold global mean temperature to 1.5K"
    args:
      urlpath: "s3://reflective-persistent-prod-large/CESM2-WACCM/G6-1.5k-HiLLA/{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier"
        type: str
        default: "r1i1p1f1"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "Aday"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "CESM2-WACCM"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5"
      temperature_target: "1.5K"
      variables_list: "https://docs.google.com/spreadsheets/d/1GfkOx6W6U5lxMb1f-xBPEtvKZZ0IDu2xtyVH7ppAQ6M/edit?usp=sharing"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "high-latitude", "CESM2-WACCM", "G6-1.5K-HiLLA", "feedback-control"]
  
  e3smv3_g6_1p5k_hilla:
    driver: zarr
    description: "E3SMv3 G6-1.5K-HiLLA (Zarr): SAI with 60°N/S injection at 15km to hold global mean temperature to 1.5K"
    args:
      urlpath: "s3://reflective-persistent-prod-large/E3SMv3/G6-1.5K-HiLLA/v3.LR.ssp245.g6_hilla.sai.{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member suffix (the urlpath carries the literal run prefix v3.LR.ssp245.g6_hilla.sai.)"
        type: str
        default: "0101"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "Aday"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "E3SMv3"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5 (on cloud hub)"
      temperature_target: "1.5K"
      grid_notes: "Unstructured grid - see /maps/README"
      variables_list: "https://docs.google.com/spreadsheets/d/1GfkOx6W6U5lxMb1f-xBPEtvKZZ0IDu2xtyVH7ppAQ6M/edit?usp=sharing"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "high-latitude", "E3SMv3", "G6-1.5K-HiLLA", "unstructured-grid", "feedback-control"]
  
  miroc_es2h_g6_1p5k_hilla:
    driver: netcdf
    description: "MIROC-ES2H G6-1.5K-HiLLA: SAI with 60°N/S injection at 15km to hold global mean temperature to 1.5K. variant='baseline' selects the SSP2-4.5 reference outputs stored under this experiment prefix; variant='G6-1.5K-HiLLA' selects the experiment."
    args:
      urlpath: "s3://reflective-persistent-prod-large/MIROC-ES2H/G6-1.5K-HiLLA/{{table}}/{{variable}}_{{variant}}_{{ensemble}}.nc"
      xarray_kwargs:
        engine: h5netcdf
    parameters:
      table:
        description: "Output table (Amon, Omon, day)"
        type: str
        default: "Amon"
      variable:
        description: "Climate variable name (MIROC-native, e.g. SurfT)"
        type: str
        default: "SurfT"
      variant:
        description: "Experiment variant: baseline (SSP2-4.5 reference) or G6-1.5K-HiLLA"
        type: str
        default: "baseline"
      ensemble:
        description: "Ensemble member identifier (e.g. r01)"
        type: str
        default: "r01"
    metadata:
      model: "MIROC"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      temperature_target: "1.5K"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "high-latitude", "MIROC", "G6-1.5K-HiLLA", "feedback-control"]


  ukesm1_ssp245:
    driver: zarr
    description: "UKESM1.1 SSP2-4.5 (RunIDs: udp-902,903,904), the reference case for G6-1.5K-HiLLA runs. This version of SSP2-4.5 has strat. het. chem. ON"
    args:
      urlpath: "s3://reflective-persistent-prod-large/UKESM1-1/SSP245/{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier"
        type: str
        default: "r1i1p1f2"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "day"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "UKESM1.1"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5 in UKESM1.1 (on cloud hub not the CMIP6 version)"
      temperature_target: "1.5K"
      variables_list: "https://docs.google.com/spreadsheets/d/1GfkOx6W6U5lxMb1f-xBPEtvKZZ0IDu2xtyVH7ppAQ6M/edit?usp=sharing"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "UKESM1.1", "SSP2-4.5", "reference"]

  e3smv3_ssp245:
    driver: zarr
    description: "E3SMv3 SSP2-4.5 reference (control runs for for G6-1.5K-HiLLA)"
    args:
      urlpath: "s3://reflective-persistent-prod-large/E3SMv3/G6-1.5K-HiLLA/v3.LR.ssp245_{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier"
        type: str
        default: "r1i1p1f1"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "day"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "E3SMv3"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5 (on cloud hub)"
      temperature_target: "1.5K"
      grid_notes: "Unstructured grid - see /maps/README"
      variables_list: "https://docs.google.com/spreadsheets/d/1GfkOx6W6U5lxMb1f-xBPEtvKZZ0IDu2xtyVH7ppAQ6M/edit?usp=sharing"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "high-latitude", "E3SMv3", "G6-1.5K-HiLLA", "unstructured-grid", "feedback-control"]
  
  cesm2_waccm_historical:
    driver: netcdf
    description: "CESM2-WACCM historical (POP ocean output). NetCDF entry preserving the pre-1.0 paths and r1->001 ensemble filename mapping; switches to a Zarr copy once one is verified in the bucket inventory."
    args:
      urlpath: "s3://reflective-persistent-prod-large/CESM2-WACCM/HISTORICAL/{{ensemble}}/{{table}}/b.e21.BW.f09_g17.HISTORICAL-WACCM.{{ensemble_id}}.pop.*.{{variable}}.*.nc"
      combine: by_coords
      concat_dim: time
      xarray_kwargs:
        engine: h5netcdf
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member (r1, r2, r3)"
        type: str
        default: "r1"
      ensemble_id:
        description: "Filename member id (001, 002, 003); derived from ensemble via metadata.value_map — set automatically by the loader"
        type: str
        default: "001"
      table:
        description: "Output table (OMON)"
        type: str
        default: "OMON"
      variable:
        description: "Climate variable name (CESM POP-native, e.g. TEMP)"
        type: str
        default: "TEMP"
    metadata:
      model: "CESM2-WACCM"
      experiment: "historical"
      experiment_id: "historical"
      value_map:
        ensemble_id:
          from: ensemble
          map: {r1: "001", r2: "002", r3: "003"}
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["CESM2-WACCM", "historical", "reference", "ocean"]

  cesm2_waccm_ssp245:
    driver: netcdf
    description: "CESM2-WACCM SSP2-4.5 reference (POP ocean output). NetCDF entry preserving the pre-1.0 paths and r1->001 ensemble filename mapping; switches to a Zarr copy once one is verified in the bucket inventory."
    args:
      urlpath: "s3://reflective-persistent-prod-large/CESM2-WACCM/SSP2-4.5/{{ensemble}}/{{table}}/b.e21.BWSSP245cmip6.f09_g17.CMIP6-SSP2-4.5-WACCM.{{ensemble_id}}.pop.*.{{variable}}.*.nc"
      combine: by_coords
      concat_dim: time
      xarray_kwargs:
        engine: h5netcdf
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member (r1, r2, r3)"
        type: str
        default: "r1"
      ensemble_id:
        description: "Filename member id (001, 002, 003); derived from ensemble via metadata.value_map — set automatically by the loader"
        type: str
        default: "001"
      table:
        description: "Output table (OMON)"
        type: str
        default: "OMON"
      variable:
        description: "Climate variable name (CESM POP-native, e.g. TEMP)"
        type: str
        default: "TEMP"
    metadata:
      model: "CESM2-WACCM"
      experiment: "SSP2-4.5"
      experiment_id: "ssp245"
      value_map:
        ensemble_id:
          from: ensemble
          map: {r1: "001", r2: "002", r3: "003"}
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["CESM2-WACCM", "SSP2-4.5", "reference", "ocean"]

  # ============================================================================
  # G6-1.5K-SAI Experiments
  # Mid-latitude injection (30°N/S at 21km) targeting 1.5K warming
  # ============================================================================
  
  ukesm1_g6_1p5k_sai:
    driver: zarr
    description: "UKESM1.1 G6-1.5K-SAI: SAI 30°N/S injection at 21km to hold global mean temperature to 1.5K"
    args:
      urlpath: "s3://reflective-persistent-prod-large/UKESM1-1/G6-1.5K-SAI/{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier"
        type: str
        default: "r1i1p1f2"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "Aday"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "UKESM1.1"
      experiment: "G6-1.5K-SAI"
      experiment_id: "g6-1.5k-sai"
      injection_strategy: "30°N/S at 21km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5"
      temperature_target: "1.5K"
      variables_status: "TBD"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      documentation: "to be added"
      hosted_on: "coming soon on AWS (CarbonPlan for some variables, many to be added to our cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      status: "coming_soon"
      tags: ["geoengineering", "SAI", "mid-latitude", "UKESM1.1", "G6-1.5K-SAI", "feedback-control"]
  
  cesm2_waccm_g6_1p5k_sai:
    driver: zarr
    description: "CESM2-WACCM G6-1.5K-SAI: SAI 30°N/S injection at 21km to hold global mean temperature to 1.5K"
    args:
      urlpath: "s3://reflective-persistent-prod-large/CESM2-WACCM/G6-1.5k-SAI/{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier"
        type: str
        default: "r1i1p1f1"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "Aday"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "CESM2-WACCM"
      experiment: "G6-1.5K-SAI"
      experiment_id: "g6-1.5k-sai"
      injection_strategy: "30°N/S at 21km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5"
      temperature_target: "1.5K"
      variables_status: "TBD"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      documentation: "to be added"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      status: "coming_soon"
      tags: ["geoengineering", "SAI", "mid-latitude", "CESM2-WACCM", "G6-1.5K-SAI", "feedback-control"]
  
  e3smv3_g6_1p5k_sai:
    driver: zarr
    description: "E3SMv3 G6-1.5K-SAI: SAI 30°N/S injection at 21km to hold global mean temperature to 1.5K"
    args:
      urlpath: "s3://reflective-persistent-prod-large/E3SMv3/G6-1.5K-SAI/{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier"
        type: str
        default: "r1i1p1f1"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "Aday"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "E3SMv3"
      experiment: "G6-1.5K-SAI"
      experiment_id: "g6-1.5k-sai"
      injection_strategy: "30°N/S at 21km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5"
      temperature_target: "1.5K"
      grid_notes: "Unstructured grid - see /maps/README"
      variables_status: "TBD"
