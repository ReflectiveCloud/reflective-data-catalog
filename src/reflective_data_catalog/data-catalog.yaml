  miroc_es2h_g6_1p5k_sai:
    driver: netcdf
    description: "MIROC-ES2H G6-1.5K-SAI: SAI with 30°N/S injection at 21km to hold global mean temperature to 1.5K. variant='baseline' selects the SSP2-4.5 reference outputs stored under this experiment prefix; variant='G6-1.5K-SAI' selects the experiment."
    args:
      urlpath: "s3://reflective-persistent-prod-large/MIROC-ES2H/G6-1.5K-SAI/{{table}}/{{variable}}_{{variant}}_{{ensemble}}.nc"
      xarray_kwargs:
        engine: h5netcdf
    parameters:
      table:
        description: "Output table (Mon, MAM3, day)"
        type: str
        default: "Mon"
      variable:
        description: "Climate variable name (MIROC-native, e.g. SurfT)"
        type: str
        default: "SurfT"
      variant:
        description: "Experiment variant: baseline (SSP2-4.5 reference) or G6-1.5K-SAI"
        type: str
        default: "G6-1.5K-SAI"
      ensemble:
        description: "Ensemble member identifier (e.g. r01)"
        type: str
        default: "r01"
    metadata:
      model: "MIROC"
      experiment: "G6-1.5K-SAI"
      experiment_id: "g6-1.5k-sai"
