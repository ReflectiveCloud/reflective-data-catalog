      urlpath: "s3://reflective-persistent-prod-large/E3SMv3/G6-1.5K-SAI/{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier"
        type: str
        default: "r1i1p1f1"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "Aday"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "E3SMv3"
      experiment: "G6-1.5K-SAI"
      experiment_id: "g6-1.5k-sai"
      injection_strategy: "30°N/S at 21km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5"
      temperature_target: "1.5K"
      grid_notes: "Unstructured grid - see /maps/README"
      variables_status: "TBD"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      documentation: "to be added"
      hosted_on: "coming soon on AWS (CarbonPlan for some variables, many to be added to our cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      status: "coming_soon"
      tags: ["geoengineering", "SAI", "mid-latitude", "E3SMv3", "G6-1.5K-SAI", "unstructured-grid", "feedback-control"]

  miroc_es2h_g6_1p5k_sai:
    driver: zarr
    description: "MIROC-ES2H G6-1.5K-SAI (Zarr, public Cloudflare R2): SAI with 30°N/S injection at 21km to hold global mean temperature to 1.5K. variant='G6-1.5K-SAI' (default) selects the experiment store; variant='baseline' selects the SSP2-4.5 reference store. The ensemble (r01-r10) is a dataset dimension."
    args:
      urlpath: "https://pub-d127229e707d485c80965ab41706e316.r2.dev/MIROC-ES2H/MIROC-ES2H_{{variant}}.zarr"
      group: "{{table}}/{{realm}}"
      consolidated: true
    parameters:
      variant:
        description: "Experiment variant store: G6-1.5K-SAI or baseline (SSP2-4.5 reference)"
        type: str
        default: "G6-1.5K-SAI"
      table:
        description: "Output table group (Mon, day, MAM3)"
        type: str
        default: "Mon"
      realm:
        description: "Realm subgroup (atmos_2d, atmos_2d_half, ocean_2d, zm_*)"
        type: str
        default: "atmos_2d"
      ensemble:
        description: "Ensemble member (r01-r10), selected along the member dimension; pass 'all' for the full ensemble"
        type: str
        default: "r01"
    metadata:
