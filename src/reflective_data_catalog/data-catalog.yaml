  # ============================================================================
  # GAUSS Experiments
  # Various injection strategies with different temperature targets
  # ============================================================================

  ## TO DO - fix paths for GAUSS data - structure is different
  cesm2_waccm6_gauss_historical:
    driver: zarr
    description: "CESM2-WACCM GAUSS: Various SAI simulations with multiple injection strategies and temperature targets"
    args:
      urlpath: "s3://reflective-persistent-prod/gauss/{{variable}}/historical/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier (includes strategy info)"
        type: str
        default: "r1i1p1f1"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "Aday"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "CESM2-WACCM"
      experiment: "GAUSS"
      experiment_id: "gauss"
      injection_strategies: ["30°N/S and 15°N/S at 21km (multi-objective)", "60°N/S", "30°N/S", "15°N/S", "Equatorial"]
      single_point_strategies: "12 Tg-SO2 for 35 years at 60, 45, 30, 15 N/S and equator"
      feedback_control: "Yes (for feedback strategies) / No (for single point)"
      control_targets: "GMT (for 60, 30, 15, Eq), GMT + hemispheric temp diff + pole-equator gradient (for multi-objective)"
      temperature_targets: ["1.5°C (multi-objective)", "1.0°C (multi-objective and other strategies)", "0.5°C (multi-objective)"]
      years: "2035-2070"
      reference_scenario: "SSP2-4.5"
      variables_location: "many on GLOBUS"
      papers: 
        - "https://www.pnas.org/doi/10.1073/pnas.2202230119 (different scenarios)"
        - "https://acp.copernicus.org/articles/23/663/2023/ (single point injections)"
        - "https://esd.copernicus.org/articles/15/191/2024/ (different injection strategies)"
      documentation: "https://reflectivecloud.github.io/Book/Resources/GAUSS/GAUSS_intro.html"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "GAUSS", "CESM2-WACCM", "multi-strategy", "multi-target", "feedback-control"]

  # ============================================================================
  # ARISE-SAI Experiments
  # Multi-objective feedback control (GMT, hemispheric temp diff, pole-equator gradient)
  # ============================================================================
  
  arise_15_cesm2_waccm_ssp245:
    driver: netcdf
    description: "ARISE-SAI 1.5°C: SAI at 30°N/S and 15°N/S (21km) with multi-objective feedback control"
    args:
