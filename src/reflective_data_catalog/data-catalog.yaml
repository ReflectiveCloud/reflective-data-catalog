metadata:
  version: 1  # intake YAML catalog format discriminator — must stay 1
  reflective_schema_version: 2  # our entry-schema version; loader asserts this
  description: "Climate Model Experiments - Solar Geoengineering (SAI) Simulations"
  documentation: "https://reflectivecloud.github.io/Book/"
  # Schema v2 (2026-08): entries renamed to the documented public source
  # names, canonical parameter vocabulary (ensemble/table/variable plus
  # per-entry extras), custom fields live under entry metadata. See
  # migration_matrix.yaml (shipped alongside) for old->new dispositions.
  
sources:
  # ============================================================================
  # G6-1.5K-HiLLA Experiments
  # High-latitude injection (60°N/S at 15km) targeting 1.5K warming
  # ============================================================================
  
  ukesm1_g6_1p5k_hilla:
    driver: netcdf
    description: "UKESM1.1 G6-1.5K-HiLLA (NetCDF): SAI with 60°N/S injection at 15km to hold global mean temperature to 1.5K. UM stream tables (ap4..onm) plus a time frequency segment — this source is NetCDF-only on the hub."
    args:
      urlpath: "s3://reflective-persistent-prod-large/UKESM1-1/G6-1p5K-HiLLA/{{ensemble}}/{{table}}/{{time}}/{{variable}}/{{variable}}_{{time}}_UKESM1-1-LL_g6-1p5-hilla_{{ensemble}}_gn_*.nc"
      combine: by_coords
      concat_dim: time
      xarray_kwargs:
        engine: h5netcdf
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier (e.g. r12i1p1f2)"
        type: str
        default: "r12i1p1f2"
      table:
        description: "UM output stream (ap4, ap5, ap6, ap8, apa, apd, apj, apm, onm)"
        type: str
        default: "ap4"
      time:
        description: "Time frequency segment (e.g. AERmon)"
        type: str
        default: "AERmon"
      variable:
        description: "Climate variable name (e.g. ua)"
        type: str
        default: "ua"
    metadata:
      model: "UKESM1.1"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5 in UKESM1.1 (on cloud hub not the CMIP6 version)"
      temperature_target: "1.5K"
      variables_list: "https://docs.google.com/spreadsheets/d/1GfkOx6W6U5lxMb1f-xBPEtvKZZ0IDu2xtyVH7ppAQ6M/edit?usp=sharing"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "high-latitude", "UKESM1.1", "G6-1.5K-HiLLA", "feedback-control"]
  
  cesm2_waccm_g6_1p5k_hilla:
    driver: zarr
    description: "CESM2-WACCM G6-1.5K-HiLLA (Zarr): SAI with 60°N/S injection at 15km to hold global mean temperature to 1.5K"
    args:
      urlpath: "https://pub-d127229e707d485c80965ab41706e316.r2.dev/CESM2-WACCM/CESM2-WACCM_G6-1.5K-HiLLA.zarr"
      group: "{{table}}/{{realm}}"
      consolidated: true
    parameters:
      table:
        description: "Output table group (Amon, Lmon, Omon, SIday, SImon, day)"
        type: str
        default: "Amon"
      realm:
        description: "Realm subgroup (atmos_2d, atmos_3d, ocean_2d, ocean_3d, land_2d, seaice_2d)"
        type: str
        default: "atmos_3d"
      ensemble:
        description: "Ensemble member (r1, r2, r3), selected along the member dimension; pass 'all' for the full ensemble"
        type: str
        default: "r1"
      ensemble_id:
        description: "Member coordinate id (001-003); derived from ensemble via metadata.value_map"
        type: str
        default: "001"
    metadata:
      model: "CESM2-WACCM"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5"
      temperature_target: "1.5K"
      variables_list: "https://docs.google.com/spreadsheets/d/1GfkOx6W6U5lxMb1f-xBPEtvKZZ0IDu2xtyVH7ppAQ6M/edit?usp=sharing"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      value_map:
        ensemble_id:
          from: ensemble
          map: {r1: "001", r2: "002", r3: "003"}
      select_map:
        member: ensemble_id
      data_access: "public"
      hosted_on: "Cloudflare R2 (public)"
      public_url: "https://pub-d127229e707d485c80965ab41706e316.r2.dev"
      tags: ["geoengineering", "SAI", "high-latitude", "CESM2-WACCM", "G6-1.5K-HiLLA", "feedback-control", "public"]
  
  e3smv3_g6_1p5k_hilla:
    driver: netcdf
    description: "E3SMv3 G6-1.5K-HiLLA (NetCDF): SAI with 60°N/S injection at 15km to hold global mean temperature to 1.5K. NetCDF-only on the hub under variable/gn/<version>/ paths; the files are CDF-5, opened via netCDF4 with a temporary local download."
    args:
      urlpath: "s3://reflective-persistent-prod-large/E3SMv3/G6-1.5K-HiLLA/v3.LR.ssp245.g6_hilla.sai.{{ensemble}}/{{table}}/{{variable}}/gn/*/*.nc"
      combine: by_coords
      concat_dim: time
      xarray_kwargs:
        engine: netcdf4
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member suffix (0101, 0151, 0201 — the urlpath carries the literal run prefix v3.LR.ssp245.g6_hilla.sai.)"
        type: str
        default: "0101"
      table:
        description: "Output table (Amon, Lmon, Omon, day, 3hr_avg, 3hr_inst — bucket-verified)"
        type: str
        default: "Amon"
      variable:
        description: "Climate variable name (E3SM-native, e.g. T, TREFHT, PRECT — bucket-verified; CMOR names like tas do not exist here)"
        type: str
        default: "T"
    metadata:
      model: "E3SMv3"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5 (on cloud hub)"
      temperature_target: "1.5K"
      grid_notes: "Unstructured grid - see /maps/README"
      variables_list: "https://docs.google.com/spreadsheets/d/1GfkOx6W6U5lxMb1f-xBPEtvKZZ0IDu2xtyVH7ppAQ6M/edit?usp=sharing"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "high-latitude", "E3SMv3", "G6-1.5K-HiLLA", "unstructured-grid", "feedback-control"]
  
  miroc_es2h_g6_1p5k_hilla:
    driver: zarr
    description: "MIROC-ES2H G6-1.5K-HiLLA (Zarr, public Cloudflare R2): SAI with 60°N/S injection at 15km to hold global mean temperature to 1.5K. variant='baseline' (default) selects the SSP2-4.5 reference store; variant='G6-1.5K-HiLLA' selects the experiment store, whose realm groups are member-suffixed (e.g. atmos_2d_r03)."
    args:
      urlpath: "https://pub-d127229e707d485c80965ab41706e316.r2.dev/MIROC-ES2H/MIROC-ES2H_{{variant}}.zarr"
      group: "{{table}}/{{realm}}"
      consolidated: true
    parameters:
      variant:
        description: "Experiment variant store: baseline (SSP2-4.5 reference) or G6-1.5K-HiLLA"
        type: str
        default: "baseline"
      table:
        description: "Output table group (baseline/SAI stores: Mon, day, MAM3; the G6-1.5K-HiLLA store: Amon, Omon, day). Default Mon; Amon when variant='G6-1.5K-HiLLA'"
        type: str
        default: "Mon"
      realm:
        description: "Realm subgroup (e.g. atmos_2d, ocean_2d; the G6-1.5K-HiLLA store uses member-suffixed groups such as atmos_2d_r03 — use list_tables()/discover()). Default atmos_2d; atmos_2d_r10 (tas, all ten members) when variant='G6-1.5K-HiLLA'"
        type: str
        default: "atmos_2d"
      ensemble:
        description: "Ensemble member (r01-r10), selected along the member dimension; pass 'all' for the full ensemble"
        type: str
        default: "r01"
    metadata:
      model: "MIROC"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      temperature_target: "1.5K"
      select_map:
        member: ensemble
      # The experiment store has no Mon/atmos_2d: it keeps Amon/Omon/day with
      # member-suffixed realms. atmos_2d_r10 carries tas for all ten members.
      defaults_by:
        variant:
          G6-1.5K-HiLLA: {table: "Amon", realm: "atmos_2d_r10"}
      data_access: "public"
      hosted_on: "Cloudflare R2 (public)"
      public_url: "https://pub-d127229e707d485c80965ab41706e316.r2.dev"
      tags: ["geoengineering", "SAI", "high-latitude", "MIROC", "G6-1.5K-HiLLA", "feedback-control", "public"]


  ukesm1_ssp245:
    driver: netcdf
    description: "UKESM1.1 SSP2-4.5 (RunIDs: udp-902,903,904), the reference case for G6-1.5K-HiLLA runs. This version of SSP2-4.5 has strat. het. chem. ON. NetCDF-only on the hub in the pre-1.0 stream/time layout; filenames carry a member label that can differ from the directory member (e.g. r12i1p1f1 directory, r12i1p1f2 in filenames), so the filename member is globbed."
    args:
      urlpath: "s3://reflective-persistent-prod-large/UKESM1-1/SSP245/{{ensemble}}/{{table}}/{{time}}/{{variable}}/{{variable}}_{{time}}_UKESM1-0-LL_ssp245_*_gn_*.nc"
      combine: by_coords
      concat_dim: time
      xarray_kwargs:
        engine: h5netcdf
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member directory (r12i1p1f1, r2i1p1f1, r3i1p1f1 — bucket-verified)"
        type: str
        default: "r12i1p1f1"
      table:
        description: "UM output stream (ap4, ap5, ap6, apm, onm — bucket-verified)"
        type: str
        default: "ap4"
      time:
        description: "Time frequency segment (e.g. AERmon)"
        type: str
        default: "AERmon"
      variable:
        description: "Climate variable name (e.g. mmrso4, ua, va)"
        type: str
        default: "mmrso4"
    metadata:
      model: "UKESM1.1"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5 in UKESM1.1 (on cloud hub not the CMIP6 version)"
      temperature_target: "1.5K"
      variables_list: "https://docs.google.com/spreadsheets/d/1GfkOx6W6U5lxMb1f-xBPEtvKZZ0IDu2xtyVH7ppAQ6M/edit?usp=sharing"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "UKESM1.1", "SSP2-4.5", "reference"]

  e3smv3_ssp245:
    driver: netcdf
    description: "E3SMv3 SSP2-4.5 reference (control runs for G6-1.5K-HiLLA). NetCDF-only on the hub under variable/gn/<version>/ paths; the files are CDF-5, opened via netCDF4 with a temporary local download."
    args:
      urlpath: "s3://reflective-persistent-prod-large/E3SMv3/G6-1.5K-HiLLA/v3.LR.ssp245_{{ensemble}}/{{table}}/{{variable}}/gn/*/*.nc"
      combine: by_coords
      concat_dim: time
      xarray_kwargs:
        engine: netcdf4
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member suffix (0101, 0151, 0201 — the urlpath carries the literal run prefix v3.LR.ssp245_)"
        type: str
        default: "0101"
      table:
        description: "Output table (Amon, Lmon, Omon, day, 3hr_avg, 3hr_inst — bucket-verified)"
        type: str
        default: "day"
      variable:
        description: "Climate variable name (E3SM-native, e.g. TREFHT, PRECT, T — bucket-verified; CMOR names like tas do not exist here)"
        type: str
        default: "TREFHT"
    metadata:
      model: "E3SMv3"
      experiment: "G6-1.5K-HiLLA"
      experiment_id: "g6-1.5k-hilla"
      injection_strategy: "60°N/S at 15km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5 (on cloud hub)"
      temperature_target: "1.5K"
      grid_notes: "Unstructured grid - see /maps/README"
      variables_list: "https://docs.google.com/spreadsheets/d/1GfkOx6W6U5lxMb1f-xBPEtvKZZ0IDu2xtyVH7ppAQ6M/edit?usp=sharing"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["geoengineering", "SAI", "high-latitude", "E3SMv3", "G6-1.5K-HiLLA", "unstructured-grid", "feedback-control"]
  
  cesm2_waccm_historical:
    driver: netcdf
    description: "CESM2-WACCM historical (POP ocean output). NetCDF-only on the hub; filenames bucket-verified (b.e21.BWHIST.f09_g17.CMIP6-historical-WACCM.*) with the r1->001 ensemble filename mapping."
    args:
      urlpath: "s3://reflective-persistent-prod-large/CESM2-WACCM/Historical/{{ensemble}}/{{table}}/b.e21.BWHIST.f09_g17.CMIP6-historical-WACCM.{{ensemble_id}}.pop.*.{{variable}}.*.nc"
      combine: by_coords
      concat_dim: time
      xarray_kwargs:
        engine: h5netcdf
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member (r1, r2, r3)"
        type: str
        default: "r1"
      ensemble_id:
        description: "Filename member id (001, 002, 003); derived from ensemble via metadata.value_map — set automatically by the loader"
        type: str
        default: "001"
      table:
        description: "Output table (OMON)"
        type: str
        default: "OMON"
      variable:
        description: "Climate variable name (CESM POP-native, e.g. TEMP)"
        type: str
        default: "TEMP"
    metadata:
      model: "CESM2-WACCM"
      experiment: "historical"
      experiment_id: "historical"
      value_map:
        ensemble_id:
          from: ensemble
          map: {r1: "001", r2: "002", r3: "003"}
      hosted_on: "AWS (cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      tags: ["CESM2-WACCM", "historical", "reference", "ocean"]

  cesm2_waccm_ssp245:
    driver: zarr
    description: "CESM2-WACCM SSP2-4.5 reference (Zarr, public Cloudflare R2), 2015-2069. One store per experiment; tables and realms are Zarr groups; the ensemble is a dataset dimension. The hub NetCDF originals extend to 2100; the public store's shorter window is a known difference."
    args:
      urlpath: "https://pub-d127229e707d485c80965ab41706e316.r2.dev/CESM2-WACCM/CESM2-WACCM_SSP2-4.5.zarr"
      group: "{{table}}/{{realm}}"
      consolidated: true
    parameters:
      table:
        description: "Output table group (Amon, Lmon, Omon, SIday, SImon, day)"
        type: str
        default: "Omon"
      realm:
        description: "Realm subgroup (atmos_2d, atmos_3d, ocean_2d, ocean_3d, land_2d, seaice_2d)"
        type: str
        default: "ocean_3d"
      ensemble:
        description: "Ensemble member (r1, r2, r3), selected along the member dimension; pass 'all' for the full ensemble"
        type: str
        default: "r1"
      ensemble_id:
        description: "Member coordinate id (001-003); derived from ensemble via metadata.value_map"
        type: str
        default: "001"
    metadata:
      model: "CESM2-WACCM"
      experiment: "SSP2-4.5"
      experiment_id: "ssp245"
      value_map:
        ensemble_id:
          from: ensemble
          map: {r1: "001", r2: "002", r3: "003"}
      select_map:
        member: ensemble_id
      data_access: "public"
      hosted_on: "Cloudflare R2 (public)"
      public_url: "https://pub-d127229e707d485c80965ab41706e316.r2.dev"
      tags: ["CESM2-WACCM", "SSP2-4.5", "reference", "ocean", "public"]

  # ============================================================================
  # G6-1.5K-SAI Experiments
  # Mid-latitude injection (30°N/S at 21km) targeting 1.5K warming
  # ============================================================================
  
  ukesm1_g6_1p5k_sai:
    driver: zarr
    description: "UKESM1.1 G6-1.5K-SAI: SAI 30°N/S injection at 21km to hold global mean temperature to 1.5K"
    args:
      urlpath: "s3://reflective-persistent-prod-large/UKESM1-1/G6-1.5K-SAI/{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier"
        type: str
        default: "r1i1p1f2"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "Aday"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "UKESM1.1"
      experiment: "G6-1.5K-SAI"
      experiment_id: "g6-1.5k-sai"
      injection_strategy: "30°N/S at 21km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5"
      temperature_target: "1.5K"
      variables_status: "TBD"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      documentation: "to be added"
      hosted_on: "coming soon on AWS (CarbonPlan for some variables, many to be added to our cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      status: "coming_soon"
      tags: ["geoengineering", "SAI", "mid-latitude", "UKESM1.1", "G6-1.5K-SAI", "feedback-control"]
  
  cesm2_waccm_g6_1p5k_sai:
    driver: zarr
    description: "CESM2-WACCM G6-1.5K-SAI: SAI 30°N/S injection at 21km to hold global mean temperature to 1.5K"
    args:
      urlpath: "https://pub-d127229e707d485c80965ab41706e316.r2.dev/CESM2-WACCM/CESM2-WACCM_G6-1.5K-SAI.zarr"
      group: "{{table}}/{{realm}}"
      consolidated: true
    parameters:
      table:
        description: "Output table group (Amon, Lmon, Omon, SIday, SImon, day)"
        type: str
        default: "Amon"
      realm:
        description: "Realm subgroup (atmos_2d, atmos_3d, ocean_2d, ocean_3d, land_2d, seaice_2d)"
        type: str
        default: "atmos_2d"
      ensemble:
        description: "Ensemble member (r1, r2, r3), selected along the member dimension; pass 'all' for the full ensemble"
        type: str
        default: "r1"
      ensemble_id:
        description: "Member coordinate id (001-003); derived from ensemble via metadata.value_map"
        type: str
        default: "001"
    metadata:
      model: "CESM2-WACCM"
      experiment: "G6-1.5K-SAI"
      experiment_id: "g6-1.5k-sai"
      injection_strategy: "30°N/S at 21km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5"
      temperature_target: "1.5K"
      variables_status: "TBD"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      documentation: "to be added"
      value_map:
        ensemble_id:
          from: ensemble
          map: {r1: "001", r2: "002", r3: "003"}
      select_map:
        member: ensemble_id
      data_access: "public"
      hosted_on: "Cloudflare R2 (public)"
      public_url: "https://pub-d127229e707d485c80965ab41706e316.r2.dev"
      tags: ["geoengineering", "SAI", "mid-latitude", "CESM2-WACCM", "G6-1.5K-SAI", "feedback-control", "public"]
  
  e3smv3_g6_1p5k_sai:
    driver: zarr
    description: "E3SMv3 G6-1.5K-SAI: SAI 30°N/S injection at 21km to hold global mean temperature to 1.5K"
    args:
      urlpath: "s3://reflective-persistent-prod-large/E3SMv3/G6-1.5K-SAI/{{ensemble}}/{{table}}/{{variable}}.zarr"
      consolidated: true
      storage_options:
        anon: false
    parameters:
      ensemble:
        description: "Ensemble member identifier"
        type: str
        default: "r1i1p1f1"
      table:
        description: "CMIP6 table (Amon, Lmon, Omon, day, etc.)"
        type: str
        default: "Aday"
      variable:
        description: "Climate variable name"
        type: str
        default: "tas"
    metadata:
      model: "E3SMv3"
      experiment: "G6-1.5K-SAI"
      experiment_id: "g6-1.5k-sai"
      injection_strategy: "30°N/S at 21km"
      feedback_control: true
      years: "2035-2085"
      reference_scenario: "SSP2-4.5"
      temperature_target: "1.5K"
      grid_notes: "Unstructured grid - see /maps/README"
      variables_status: "TBD"
      paper: "https://egusphere.copernicus.org/preprints/2025/egusphere-2025-5742/"
      documentation: "to be added"
      hosted_on: "coming soon on AWS (CarbonPlan for some variables, many to be added to our cloudhub)"
      s3_bucket: "s3://reflective-persistent-prod-large"
      status: "coming_soon"
      tags: ["geoengineering", "SAI", "mid-latitude", "E3SMv3", "G6-1.5K-SAI", "unstructured-grid", "feedback-control"]

  miroc_es2h_g6_1p5k_sai:
    driver: zarr
    description: "MIROC-ES2H G6-1.5K-SAI (Zarr, public Cloudflare R2): SAI with 30°N/S injection at 21km to hold global mean temperature to 1.5K. variant='G6-1.5K-SAI' (default) selects the experiment store; variant='baseline' selects the SSP2-4.5 reference store. The ensemble (r01-r10) is a dataset dimension."
    args:
      urlpath: "https://pub-d127229e707d485c80965ab41706e316.r2.dev/MIROC-ES2H/MIROC-ES2H_{{variant}}.zarr"
