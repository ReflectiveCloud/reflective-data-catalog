# Migration matrix: single owner of old->new dispositions for the v1.0
# migration from FlexibleSource configs to the YAML catalog (plan KTD5).
#
# Ships in the wheel; the guidance errors (R12), docs/migration-matrix.md,
# and the README migration guide all render from this file. CI cross-checks
# mapped values against tests/fixtures/bucket_inventory.json.
#
# Row status vocabulary:
#   verified              - confirmed against a bucket listing
#   pending_verification  - awaiting hub/R2 credentials (U1 audit rerun)
version: 1

# One row per pre-1.0 flexible source (the documented public names).
sources:
  cesm2_waccm_g6_1p5k_hilla:
    new_entry: cesm2_waccm_g6_1p5k_hilla
    backend: "netcdf->zarr (public Cloudflare R2, one store per experiment)"
    status: verified  # live-opened 2026-08-12 (public store)
    old_defaults: {table: AMON, variable: T, ensemble: r1}
    new_defaults: {table: Amon, ensemble: r1}
    value_notes:
      ensemble: "r1/r2/r3 preserved; selected along the member dimension (coordinate values 001/002/003 via value_map); pass ensemble='all' for the full ensemble"
      table: "case fix AMON->Amon; tables are Zarr groups (Amon, Lmon, Omon, Oyr, SIday, SImon, day, Lday) with realm subgroups"
      variable: "no longer a parameter — CESM-native variables (T, TREFHT, ...) are selected from the opened dataset; default realm atmos_3d carries T"
  cesm2_waccm_historical:
    new_entry: cesm2_waccm_historical
    backend: "netcdf (unchanged; NetCDF-only — prefix corrected HISTORICAL -> Historical per maintainer 2026-08-13; filename corrected to b.e21.BWHIST.f09_g17.CMIP6-historical-WACCM.* per the 2026-08-13 hub audit)"
    status: verified  # 2026-08-31 hub audit: the corrected glob matches (BWHIST.f09_g17.CMIP6-historical-WACCM, 185001-201412)
    old_defaults: {table: OMON, variable: TEMP, ensemble: r1}
    new_defaults: {table: OMON, variable: TEMP, ensemble: r1}
    value_notes:
      variable: "POP-native names preserved (TEMP, ...); the pre-1.0 filename pattern (HISTORICAL-WACCM) never matched the bucket — corrected to BWHIST.f09_g17.CMIP6-historical-WACCM"
  cesm2_waccm_ssp245:
    new_entry: cesm2_waccm_ssp245
    backend: "netcdf->zarr (public Cloudflare R2, one store per experiment)"
    status: verified  # live-opened 2026-08-12 (public store)
    old_defaults: {table: OMON, variable: TEMP, ensemble: r1}
    new_defaults: {table: Omon, ensemble: r1}
    value_notes:
      table: "case fix OMON->Omon; default realm ocean_3d carries TEMP"
      variable: "no longer a parameter — selected from the opened dataset"
      time_window: "the public store spans 2015-2069 (660 months); the hub NetCDF originals run to 2100 (1032 months). Accepted for v1.0 per maintainer 2026-08-13; tracked in the Cloud Hub Asana project"
  e3smv3_g6_1p5k_hilla:
    new_entry: e3smv3_g6_1p5k_hilla
    backend: "netcdf (unchanged; never zarrified — the hub holds the original CDF-5 tree under variable/gn/<version>/, opened via netCDF4 with a temporary local download; maintainer decision 2026-08-31)"
    status: verified  # 2026-08-31 hub audit: 10 files match the default render (Amon/T/gn/13112025)
    old_defaults: {table: Amon, variable: T, ensemble: v3.LR.ssp245.g6_hilla.sai.0101}
    new_defaults: {table: Amon, variable: T, ensemble: "0101"}
    value_notes:
      ensemble: "bucket-verified run suffixes: 0101, 0151, 0201 (urlpath carries the literal prefix v3.LR.ssp245.g6_hilla.sai.)"
      table: "bucket-verified tables: Amon, Lmon, Omon, day, 3hr_avg, 3hr_inst (the pre-fix Aday default did not exist)"
      variable: "E3SM-native names preserved (T, TREFHT, PRECT, ... — bucket-verified 2026-08-13); CMOR names like tas do not exist"
  miroc_es2h_g6_1p5k_hilla:
    new_entry: miroc_es2h_g6_1p5k_hilla
    renamed_from_yaml: miroc_g6_1p5k_hilla
    absorbs: "miroc_ssp245_(g6_1p5k_hilla)"
    backend: "netcdf->zarr (public Cloudflare R2, one store per variant)"
    status: verified  # live-opened 2026-08-12 (public store)
    old_defaults: {table: Amon, variable: SurfT, ensemble: r01, variant: baseline}
    new_defaults: {table: Mon, ensemble: r01, variant: baseline}
    hint_exempt: [table]  # Amon is still valid on the G6-1.5K-HiLLA variant store
    value_notes:
      variant: "baseline (default; the SSP2-4.5 reference store) or G6-1.5K-HiLLA (member-suffixed realm groups, sparse member coverage)"
      table: "baseline/SAI stores use Mon/day/MAM3 (old Amon -> Mon); the HiLLA variant store keeps Amon/Omon/day"
      variable: "no longer a parameter — SurfT and friends are selected from the opened dataset (Mon/atmos_2d)"
      ensemble: "r01-r10 as a member dimension (ten members, up from three)"
  miroc_es2h_g6_1p5k_sai:
    new_entry: miroc_es2h_g6_1p5k_sai
    renamed_from_yaml: miroc_g6_1p5k_sai
    absorbs: "miroc_ssp245_(g6_1p5k_sai)"
    backend: "netcdf->zarr (public Cloudflare R2, one store per variant)"
    status: verified  # live-opened 2026-08-12 (public store)
    old_defaults: {table: Mon, variable: SurfT, ensemble: r01, variant: G6-1.5K-SAI}
    new_defaults: {table: Mon, ensemble: r01, variant: G6-1.5K-SAI}
    value_notes:
      variable: "no longer a parameter — SurfT and friends are selected from the opened dataset (Mon/atmos_2d)"
      ensemble: "r01-r10 as a member dimension"
  ukesm1_g6_1p5k_hilla:
    new_entry: ukesm1_g6_1p5k_hilla
    renamed_from_yaml: ukesm1_g6_1p5k_hilla_zarr
    backend: "netcdf (unchanged; the source is NetCDF-only — prefix corrected G6-1.5K-HiLLA -> G6-1p5K-HiLLA per maintainer 2026-08-13)"
    status: verified  # 2026-08-13 hub audit: 3 files match the default render; members r12i1p1f2, r2i1p1f2, r3i1p1f2
    old_defaults: {table: ap4, variable: ua, ensemble: r12i1p1f2, time: AERmon}
    new_defaults: {table: ap4, variable: ua, ensemble: r12i1p1f2, time: AERmon}
    value_notes:
      time: "retained on this entry — the time kwarg removal applies only to Zarr-switched UKESM data (ukesm1_ssp245)"
  ukesm1_ssp245:
    new_entry: ukesm1_ssp245
    renamed_from_yaml: ukesm1_ssp245_g6_1p5k_hilla
    backend: "netcdf (unchanged; the source was never zarrified — the 2026-08-13 hub listing shows the pre-1.0 stream/time NetCDF layout intact)"
    status: verified  # 2026-08-31 hub audit: 3 files match the default render (members r12i1p1f1, r2i1p1f1, r3i1p1f1)
    old_defaults: {table: ap4, variable: mmrso4, ensemble: r12i1p1f1, time: AERmon}
    new_defaults: {table: ap4, variable: mmrso4, ensemble: r12i1p1f1, time: AERmon}
    value_notes:
      ensemble: "bucket-verified members: r12i1p1f1, r2i1p1f1, r3i1p1f1 (the old default was correct; the pre-fix YAML default r1i1p1f2 did not exist). Filenames carry a member label that can differ from the directory member (r12i1p1f1 dir, r12i1p1f2 in filenames); the filename member is globbed"
      table: "UM stream names unchanged (ap4, ap5, ap6, apm, onm — bucket-verified 2026-08-13)"

# Kwarg dispositions (R11): canonical vocabulary, permanent aliases,
# per-entry extras, removals with redirects.
kwargs:
  ensemble: "canonical; aliases: ensemble_member, member_id"
  table: "canonical; aliases: table_id"
  variable: "canonical; aliases: variable_id. On the grouped public-R2 Zarr entries (CESM/MIROC) variables are selected from the opened dataset, not a path parameter"
  variant: "kept as a per-entry parameter on the MIROC entries"
  time: "per-entry parameter on both UKESM hub entries (ukesm1_ssp245 and ukesm1_g6_1p5k_hilla), whose stream/time NetCDF layouts are unchanged"
  realm: "per-entry parameter on ARISE CESM entries"
  time_frequency: "per-entry parameter on ARISE CESM entries"
  version: "per-entry parameter on ukesm1_arise_cmip6"

# Stability dispositions for every catalog entry at v1.0 (deliberate freeze).
stability:
  ukesm1_g6_1p5k_hilla: stable  # NetCDF-only at the maintainer-corrected prefix G6-1p5K-HiLLA
  cesm2_waccm_g6_1p5k_hilla: stable
  e3smv3_g6_1p5k_hilla: stable
  miroc_es2h_g6_1p5k_hilla: stable
  miroc_es2h_g6_1p5k_sai: stable
  cesm2_waccm_historical: stable  # NetCDF-only at the maintainer-corrected prefix Historical
  cesm2_waccm_ssp245: stable
  ukesm1_ssp245: stable
  e3smv3_ssp245: stable
  ukesm1_g6_1p5k_sai: experimental   # status coming_soon in entry metadata
  cesm2_waccm_g6_1p5k_sai: stable  # public R2 store live-opened 2026-08-12
  e3smv3_g6_1p5k_sai: experimental   # status coming_soon
  cesm2_waccm6_gauss_historical: experimental  # TODO paths; excluded from R3 gate
  arise_15_cesm2_waccm_ssp245: stable  # verified 2026-08-12 (public)
  arise_sai_15: stable               # verified 2026-08-12 after U2 glob/default fix
  ukesm1_arise_sai: stable           # verified 2026-08-12 (public)
  ukesm1_arise_cmip6: stable         # verified 2026-08-12 after default version fix
  # Simulator-input stores (public R2, simulator-inputs/): all ten
  # live-opened credential-free 2026-08-31 (zarr v3, consolidated,
  # Mon/atmos_2d default group, 3-member ensembles).
  simulator_cesm2_waccm_ma_0p5k_sai: stable
  simulator_cesm2_waccm_ma_1p0k_sai: stable
  simulator_cesm2_waccm_ma_1p5k_sai: stable
  simulator_cesm2_waccm_ma_baseline: stable
  simulator_cesm2_waccm_ma_historical: stable
  simulator_miroc_es2h_g6_0p5k_sai: stable
  simulator_miroc_es2h_g6_1p5k_sai: stable
  simulator_miroc_es2h_baseline: stable
  simulator_miroc_es2h_historical: stable
  simulator_miroc_es2h_ssp245: stable

# Bucket-verified corrections applied in U2 (from tests/fixtures/bucket_inventory.json).
verified_corrections:
  - "2026-08-31 hub listing round 4: E3SM was never zarrified either — the hub holds the original CDF-5 NetCDF tree at v3.LR.ssp245*/{table}/{variable}/gn/<version>/*.nc (the earlier audit's 'variable stores' were these directories, suffix-free). Both e3smv3 entries reverted to NetCDF (maintainer decision: ship with netCDF4 + temporary local download, since h5netcdf cannot read CDF-5); e3smv3_g6_1p5k_hilla dropped from the equivalence gate (backend unchanged). ukesm1_ssp245 and cesm2_waccm_historical audits verified at their corrected templates."
  - "2026-08-13 hub listing round 3: ukesm1_ssp245 was NEVER zarrified — the hub holds the pre-1.0 stream/time NetCDF layout intact (ap4/AERmon/mmrso4/*.nc etc.). The 2026-08-12 ORIGINALS-GONE verdict was a glob artifact: filenames carry member label r12i1p1f2 under the r12i1p1f1 directory, so the member-pinned filename glob matched nothing. Entry reverted to NetCDF with its full pre-1.0 defaults (ap4/AERmon/mmrso4, filename member globbed); the time kwarg is retained everywhere — no entry drops it at v1.0; source dropped from the equivalence gate (backend unchanged)."
  - "2026-08-13 hub audit round 2: ukesm1_g6_1p5k_hilla VERIFIED at the corrected G6-1p5K-HiLLA prefix (3 files match the default render). cesm2_waccm_historical filenames are b.e21.BWHIST.f09_g17.CMIP6-historical-WACCM.* (the pre-1.0 HISTORICAL-WACCM pattern never matched; glob corrected). E3SM Zarr stores keep E3SM-native variable names (T, TREFHT, ...) — no tas; both e3smv3 entry defaults corrected. ukesm1_ssp245 Zarr layout retains UM stream directories (ap4/ap5/ap6/apm/onm), not CMOR tables — table default fixed back to ap4; variable vocabulary under ap4 pending a listing."
  - "2026-08-13 maintainer correction: UKESM G6 HiLLA lives ONLY as NetCDF under UKESM1-1/G6-1p5K-HiLLA (1p5K, not 1.5K) and CESM historical ONLY as NetCDF under CESM2-WACCM/Historical (not HISTORICAL) — every earlier empty-prefix finding was a spelling mismatch; both entries corrected and restored to stable; ukesm1_g6_1p5k_hilla stays NetCDF with its time parameter."
  - "2026-08-13 maintainer audit: ukesm1_ssp245 members are r12i1p1f1/r2i1p1f1/r3i1p1f1 (default fixed); e3smv3 G6-1.5K-HiLLA tables are Amon/Lmon/Omon/day/3hr_* with run suffixes 0101/0151/0201 (Aday default fixed to Amon; e3smv3_ssp245 member default fixed to 0101); UKESM1-1/G6-1.5K-HiLLA and CESM2-WACCM/HISTORICAL hub prefixes are EMPTY — both entries marked experimental pending data relocation."
  - "2026-08-12: CESM and MIROC zarrified copies located in the PUBLIC Cloudflare R2 bucket reflective-data-store (one zarr-v3 store per model x experiment; tables/realms as groups; ensemble as a member dimension — CESM members 001-003, MIROC r01-r10). Five entries re-pointed to public HTTPS URLs needing no credentials; cesm2_waccm_historical has no public store and keeps its hub NetCDF entry."
  - "2026-08-12 gate run (maintainer credentials): the pre-1.0 UKESM NetCDF originals no longer exist in the hub bucket — the Zarr copies are the only copies. Amended R4 disposition: sources with ORIGINALS-GONE verdicts are verified by the bucket audit (existence/format/chunk completeness) instead of A/B equivalence; no NetCDF fallback exists."
  - "ukesm1_arise_cmip6: default version v20220325 -> v20190715 (bucket lists only v20190715)"
  - "arise_sai_15: glob hardcoded .cam.h0. (monthly stream) while default time_frequency day_5 holds .cam.h7. files; glob made stream-agnostic, default moved to month_1"

# Method-level API changes at v1.0 (rendered into the migration guide and
# CHANGELOG alongside the source rows).
api:
  - "get_source_config() removed; use get_source(name) and get_parameters(name)"
  - "get_parameters() drops the is_flexible key and unifies on {name, driver, description, parameters}"
  - "search()/list_sources()/list_tags() return structured records; printing moves behind verbose=True"
  - "unknown source names raise SourceNotFoundError (an AttributeError subclass) instead of bare AttributeError/ValueError"
  - "unknown keyword arguments raise TypeError (previously silently ignored)"
  - "old parameter values on renamed backends raise a guidance error carrying rows from this matrix"
  - "get_source(name) added for string-keyed and typed access"
