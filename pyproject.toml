[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"

[project]
name = "reflective-data-catalog"
dynamic = ["version"]
authors = [
    {name = "John Orcutt", email = "john@reflective.org"},
    {name = "Alistair Duffey", email="alistair@reflective.org"}
]
license = "Apache-2.0"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
description = "Reflective's Unified SAI Data Catalog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "xarray>=2025.01.0",
    "obstore>=0.8.0",
    "pyyaml>=6.0",
    "fsspec>=2024.10.0",
    "s3fs>=2024.10.0",
    "h5netcdf>=1.3.0",
    "dask>=2024.10.0",
    "zarr>=3.0",
]

[project.urls]
source-code = "https://github.com/ReflectiveCloud/reflective-data-catalog"
homepage = "https://reflective.org"
issues = "https://github.com/ReflectiveCloud/reflective-data-catalog/issues"
changelog = "https://github.com/ReflectiveCloud/reflective-data-catalog/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
reflective_data_catalog = ["data-catalog.yaml", "migration_matrix.yaml", "py.typed"]

[project.optional-dependencies]
esm = [
    "intake-esm>=2025.2.3",
]
esgf = [
    # Floor verified against the live federation in a fresh env; 2026.9.4
    # cannot resolve file access for standard CMIP6 datasets (upstream
    # regression), and <=2025.x cannot import with globus-sdk 4.
    "intake-esgf>=2026.6.4,!=2026.9.4",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=6.0",
    "ruff>=0.12.0",
    "pre-commit>=3.0",
    "intake>=2.0.0",
    "intake-esm>=2025.2.3",
    "intake-esgf>=2026.6.4,!=2026.9.4",  # see the esgf extra
    # scripts/equivalence_gate.py only: the E3SM NetCDF originals are CDF-5,
    # unreadable by h5netcdf.
    "netCDF4>=1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
# Set the maximum line length to 88 (Black's default)
line-length = 88

target-version = "py311"

# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*.ipynb",
]

[tool.ruff.lint]
# Enable commonly used rule sets
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "RUF",   # Ruff-specific rules
]

# Ignore specific rules that are often too strict
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults
    "ARG001",  # unused function argument
    "ARG002",  # unused method argument
]

# Allow autofix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore certain rules in test files
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "ARG",     # unused arguments ok in tests
    "PLR2004", # magic values ok in tests
]
# Ignore import rules in __init__.py files
"__init__.py" = [
    "F401",    # unused imports ok in __init__.py
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces, rather than tabs
indent-style = "space"

# Keep Markdown code examples hand-formatted (ruff >= 0.16 formats
# Python fences in .md files by default; docs snippets are prose).
exclude = ["*.md"]

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending
line-ending = "auto"

[tool.ruff.lint.isort]
# Use a single line for each import
force-single-line = false

# Organize imports by type
known-first-party = ["reflective_data_catalog"]