name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    branches: [main]
    tags: ["*"]

jobs:
  test:
    name: Tests (gate)
    uses: ./.github/workflows/tests.yml

  build:
    name: Build distribution 📦
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        fetch-depth: 0  # full history so setuptools-scm can compute the version
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        twine
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Check distribution metadata
      run: python3 -m twine check dist/*
    - name: Assert packaged data files ship in the wheel
      run: |
        python3 - <<'EOF'
        import glob, sys, zipfile
        wheel = glob.glob("dist/*.whl")[0]
        names = zipfile.ZipFile(wheel).namelist()
        required = [
            "reflective_data_catalog/data-catalog.yaml",
            "reflective_data_catalog/migration_matrix.yaml",
            "reflective_data_catalog/py.typed",
        ]
        missing = [r for r in required if r not in names]
        if missing:
            sys.exit(f"wheel is missing packaged data files: {missing}")
        print("wheel contains:", ", ".join(required))
        EOF
    - name: Release gates — bucket inventory verified and equivalence gates passed (tags only)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        python3 - <<'EOF'
        import json
        import re
        import sys
        from pathlib import Path

        failures = []
        inventory = json.loads(Path("tests/fixtures/bucket_inventory.json").read_text())
        for name, record in inventory["entries"].items():
            for url in record["urls"]:
                if url.get("status") != "verified":
                    failures.append(f"inventory: {name} is {url.get('status')}")
        for note in sorted(Path("docs/migration-notes").glob("*.md")):
            match = re.search(r"\*\*Verdict: (\S+)\*\*", note.read_text())
            verdict = match.group(1) if match else "MISSING"
            if verdict not in ("PASS", "ORIGINALS-GONE"):
                failures.append(f"equivalence: {note.stem} is {verdict}")
        if failures:
            print("Release blocked — credential-gated verification incomplete:")
            for f in failures:
                print(f"  - {f}")
            print("Run scripts/bucket_audit.py and scripts/equivalence_gate.py "
                  "with hub read credentials, commit the results, and re-tag.")
            sys.exit(1)
        print("Release gates clean: inventory verified, equivalence gates passed.")
        EOF
    - name: Install-and-import smoke test of the built wheel
      run: |
        python3 -m venv /tmp/smoke
        /tmp/smoke/bin/pip install --quiet dist/*.whl
        /tmp/smoke/bin/python - <<'EOF'
        from importlib.resources import files

        import reflective_data_catalog

        assert files("reflective_data_catalog").joinpath("data-catalog.yaml").is_file()
        print("import smoke OK:", reflective_data_catalog.__version__)
        EOF
    - name: Store the distribution packages
      uses: actions/upload-artifact@v5
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reflective-data-catalog
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    if: github.ref == 'refs/heads/main'  # TestPyPI only from main, never branches
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/reflective-data-catalog

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true
